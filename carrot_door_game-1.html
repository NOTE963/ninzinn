<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>扉の向こうに人参</title>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
:root{--blood:#b3121a;--bone:#e6dccb;--ink:#060304;--wood:#2a1a12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);font-family:'Yuji Syuku','Hiragino Mincho ProN','Yu Mincho',serif;overflow:hidden}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:18px 18px 14px;overflow:auto}
.screen.on{display:flex}
h1{font-size:44px;letter-spacing:.12em;margin:14px 0 2px;color:var(--bone);text-shadow:0 0 18px #7a0b10,2px 3px 0 #3b0509;font-weight:400;text-align:center;line-height:1.15;animation:flick 5s infinite}
.sub{opacity:.6;margin:0 0 14px;font-size:14px;letter-spacing:.2em}
input{width:100%;max-width:300px;font:inherit;font-size:20px;text-align:center;padding:10px;background:#120a0a;color:var(--bone);border:1px solid #5a2a2a;border-radius:2px;outline:none}
input:focus{border-color:var(--blood);box-shadow:0 0 12px #7a0b1060}
.btn{font:inherit;font-size:22px;letter-spacing:.2em;padding:12px 34px;margin:12px 0 6px;background:var(--blood);color:#fff;border:0;border-radius:2px;box-shadow:0 5px 0 #5a0a0e;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #5a0a0e}
.btn.ghost{background:transparent;border:1px solid #6a4a4a;box-shadow:none;font-size:16px;padding:8px 20px;color:var(--bone)}
.rules{font-size:14px;line-height:1.8;opacity:.8;margin:6px 0 0;padding:0 0 0 1.2em;max-width:320px}
.board{width:100%;max-width:320px;margin-top:12px}
.board h2{font-size:18px;font-weight:400;margin:0 0 6px;border-bottom:1px solid #4a2a2a;padding-bottom:4px;letter-spacing:.2em}
.board ol{margin:0;padding:0;list-style:none;font-size:17px}
.board li{display:flex;gap:10px;padding:3px 0;border-bottom:1px dashed #2a1a1a}
.board li b{width:1.6em;color:#8a6a6a;font-weight:400}.board li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li.me{color:#ff6a6a}.msg{opacity:.55;font-size:14px;padding:6px 0}
#game{padding:0}
#hud{width:100%;padding:12px 16px 4px;display:flex;justify-content:space-between;align-items:flex-end;font-size:16px;z-index:5}
#hud .big{font-size:32px;line-height:1}
#qbar{width:calc(100% - 32px);height:6px;background:#1c1010;margin:4px 0 0}
#qbar i{display:block;height:100%;width:100%;background:#c9a24a;transition:background .2s}
#qbar.low i{background:var(--blood)}
#stage{flex:1;width:100%;display:grid;place-items:center;position:relative;animation:flick 7s infinite}
#stage.danger::after{content:"";position:absolute;inset:0;pointer-events:none;animation:dng .45s infinite alternate;box-shadow:inset 0 0 120px 40px #b3121a}
@keyframes dng{from{opacity:.25}to{opacity:.95}}
@keyframes flick{0%,92%,100%{filter:brightness(1)}93%{filter:brightness(.55)}94%{filter:brightness(1)}96%{filter:brightness(.7)}}
#frame{position:relative;width:min(68vw,290px);aspect-ratio:5/8;background:#000;border:12px solid var(--wood);border-bottom-width:6px;perspective:900px;box-shadow:0 0 0 3px #120a07,0 0 60px #000}
#doorway{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#4a1010 0%,#12040a 55%,#030102 100%)}
#door{position:absolute;inset:0;transform-origin:left center;transition:transform .17s ease-in;background:
 linear-gradient(90deg,#0004 0,#0000 8%,#0000 92%,#0006 100%),
 repeating-linear-gradient(90deg,#3a2418 0 14px,#33200f 14px 15px,#3c261a 15px 33px);
 box-shadow:inset 0 0 0 6px #24150e,inset 0 0 0 8px #4a3022;backface-visibility:visible}
#door::before{content:"";position:absolute;left:16%;right:16%;top:9%;height:36%;border:3px solid #1c100a;box-shadow:inset 0 0 14px #000a}
#door::after{content:"";position:absolute;right:12%;top:52%;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8c28a,#6a5424);box-shadow:0 0 6px #000}
#frame.open #door{transform:rotateY(-82deg)}
.cw{position:absolute;aspect-ratio:378/560;pointer-events:none}
.cw img{width:100%;height:100%;display:block;filter:drop-shadow(0 0 14px #ff2a0a90)}
.eye{position:absolute;width:8%;height:4%;background:#ff1d1d;border-radius:50%;box-shadow:0 0 10px 4px #ff0000,0 0 22px 8px #ff000080;animation:eye .3s infinite alternate}
@keyframes eye{to{opacity:.55}}
#carrot{left:50%;bottom:-3%;width:82%;transform:translateX(-50%) scale(0);transform-origin:50% 100%}
#carrot.show{animation:rise .22s forwards}
@keyframes rise{from{transform:translateX(-50%) scale(.15) rotate(-12deg)}to{transform:translateX(-50%) scale(1) rotate(0)}}
#carrot.show img{animation:wob .12s infinite alternate}
@keyframes wob{to{transform:translateX(3px) rotate(1.5deg)}}
#carrot.dead{animation:die .3s forwards}
@keyframes die{0%{filter:brightness(5)}100%{transform:translateX(-50%) scale(.6) rotate(40deg);opacity:0}}
#man{left:50%;bottom:0;width:66%;aspect-ratio:191/440;transform:translateX(-50%);opacity:0}
#man.show{opacity:1;animation:sway 1.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:translateX(-50%) rotate(-2.5deg)}to{transform:translateX(-50%) rotate(2.5deg)}}
#man img{filter:drop-shadow(0 0 12px #fff4)}
#scare.man .eye{display:none}
#quota.flash{animation:qf .6s}@keyframes qf{0%,60%{color:#ffd24a;transform:scale(1.15)}}
#slash{position:absolute;left:-10%;top:45%;width:120%;height:5px;background:#fff;box-shadow:0 0 14px #fff;transform:rotate(-25deg) scaleX(0);opacity:0;pointer-events:none}
#slash.go{animation:sl .25s}
@keyframes sl{0%{opacity:1;transform:rotate(-25deg) scaleX(0)}50%{opacity:1;transform:rotate(-25deg) scaleX(1)}100%{opacity:0;transform:rotate(-25deg) scaleX(1)}}
#fuse{width:min(68vw,290px);height:8px;background:#1c1010;margin:12px 0 0;visibility:hidden}
#fuse i{display:block;height:100%;background:#ff2a2a;box-shadow:0 0 8px red}
#fuse.go{visibility:visible}#fuse.go i{animation:fz 1s linear forwards}
@keyframes fz{from{width:100%}to{width:0}}
#tip{height:22px;font-size:14px;opacity:.6;margin-top:6px;text-align:center}
#door-btn{width:116px;height:116px;border-radius:50%;margin:6px 0 20px;border:4px solid #3a1a1a;background:radial-gradient(circle at 35% 30%,#d02a2a,#6a0a10 70%);color:#fff;font:inherit;font-size:22px;letter-spacing:.1em;box-shadow:0 8px 0 #3a0508,0 0 30px #7a0b1070;cursor:pointer}
#door-btn:active{transform:translateY(6px);box-shadow:0 2px 0 #3a0508}
#banner{position:absolute;inset:0;display:none;place-items:center;text-align:center;background:#000d;z-index:20;font-size:30px;line-height:1.6;white-space:pre-line;padding:20px}
#banner.on{display:grid;animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:10;background:radial-gradient(ellipse at center,#0000 35%,#000d 100%)}
#scare{position:fixed;inset:0;z-index:50;background:#000;display:none;overflow:hidden}
#scare.on{display:block;animation:shk .06s infinite}
#scare.on::before{content:"";position:absolute;inset:0;background:#c00;animation:rf .5s forwards}
@keyframes rf{from{opacity:.9}to{opacity:.0}}
@keyframes shk{0%{transform:translate(8px,-6px)}50%{transform:translate(-9px,7px)}100%{transform:translate(6px,8px)}}
#scare .cw{left:50%;top:50%;width:80vw;max-width:420px;transform:translate(-50%,-50%) scale(.3);}
#scare.on .cw{animation:lunge .32s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes lunge{to{transform:translate(-50%,-48%) scale(3.1) rotate(-6deg)}}
#over h2{font-size:40px;font-weight:400;color:var(--blood);margin:16px 0 4px;letter-spacing:.2em;text-shadow:0 0 14px #5a0a0e}
#over .why{opacity:.75;margin:0 0 10px;text-align:center}
#over .score{font-size:64px;line-height:1.1}
.nb{color:#ffd24a;font-size:18px;min-height:26px;letter-spacing:.15em}
@media (prefers-reduced-motion:reduce){#stage,h1{animation:none}}
</style></head><body>
<div id="app">
 <section id="home" class="screen on">
  <h1>扉の向こうに<br>人参</h1><p class="sub">開けるな。開けろ。</p>
  <input id="name" maxlength="12" placeholder="なまえ（12文字まで）" autocomplete="off">
  <button class="btn" id="start">はじめる</button>
  <button class="btn ghost" id="rankbtn">ランキングを見る</button>
  <ol class="rules">
   <li>下のボタンで扉を開けて、閉める。開けるたび1点。</li>
   <li>人参がいたら<b>1秒以内にタップ</b>。遅れると襲われる。</li>
   <li>人参を倒さずに閉めたら、終わり。</li>
   <li><b>眼鏡の男には触るな。</b>触れたら終わり。何もせず閉めろ。</li>
   <li>ノルマは途切れず続く。時間内に開け閉めしきれ。</li>
  </ol>
 </section>
 <section id="rank" class="screen">
  <h1 style="font-size:34px">ランキング</h1><p class="sub">開けた回数・自己ベスト</p>
  <div class="board"><ol id="rank-view"></ol></div>
  <button class="btn ghost" id="rankback" style="margin-top:18px">ホームへ戻る</button>
 </section>
 <section id="game" class="screen">
  <div id="hud"><div><div style="font-size:13px;opacity:.6">開けた回数</div><div class="big" id="score">0</div></div>
   <div style="text-align:right"><div id="rnd" style="font-size:13px;opacity:.6"></div><div id="quota" class="big" style="font-size:24px"></div></div></div>
  <div id="qbar"><i></i></div>
  <div id="stage">
   <div id="frame"><div id="doorway">

<script>
const $=id=>document.getElementById(id);
/* ---------- Firebase ---------- */
const firebaseConfig={apiKey:"AIzaSyAitmCVB6ILKx2CgxmC7CIKlf16OSch_N4",authDomain:"hirai1.firebaseapp.com",databaseURL:"https://hirai1-default-rtdb.firebaseio.com",projectId:"hirai1",storageBucket:"hirai1.firebasestorage.app",messagingSenderId:"227398539379",appId:"1:227398539379:web:44ead14c65d055c5e9b206",measurementId:"G-K8CK47S5KB"};
let db=null;try{firebase.initializeApp(firebaseConfig);db=firebase.database()}catch(e){console.warn(e)}
const keyOf=n=>encodeURIComponent(n).replace(/\./g,'%2E');
async function loadRank(el,me){
  el.innerHTML='<li class="msg">読み込み中…</li>';
  if(!db){el.innerHTML='<li class="msg">ランキングに接続できません</li>';return}
  try{
    const s=await db.ref('ranking').orderByChild('score').limitToLast(10).once('value');
    const a=[];s.forEach(c=>{a.push(c.val())});a.reverse();el.innerHTML='';
    if(!a.length){el.innerHTML='<li class="msg">まだ誰も生き残っていない</li>';return}
    a.forEach((r,i)=>{const li=document.createElement('li');if(r.name===me)li.className='me';
      li.innerHTML='<b></b><span></span><em style="font-style:normal"></em>';
      li.children[0].textContent=i+1;li.children[1].textContent=r.name;li.children[2].textContent=r.score+'回';el.appendChild(li)});
  }catch(e){el.innerHTML='<li class="msg">ランキングを取得できません</li>'}
}
async function saveBest(name,score){ // 最高記録のみ自動で更新
  if(!db||score<=0)return {ok:false};
  try{const r=await db.ref('ranking/'+keyOf(name)).transaction(c=>(!c||c.score<score)?{name,score,ts:Date.now()}:undefined);
    return {ok:true,isNew:r.committed,best:r.snapshot.val()&&r.snapshot.val().score}}catch(e){return {ok:false}}
}
/* ---------- Audio ---------- */
let AC,dr;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,t='sine',v=.2,f2){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(a.destination);o.start();o.stop(n+d)}
function noise(d,v=.3,fq=1500){const a=ac();if(!a)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=fq;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);s.connect(f).connect(g).connect(a.destination);s.start()}
const creak=()=>{tone(95,.28,'sawtooth',.07,55);tone(150,.2,'square',.03,90);noise(.18,.08,500)};
const shut=()=>{noise(.14,.25,300);tone(60,.15,'sine',.4,35)};
const beat=()=>{tone(55,.12,'sine',.6,40);setTimeout(()=>tone(50,.14,'sine',.5,38),150)};
const hit=()=>{noise(.12,.3,3000);tone(420,.12,'square',.12,70)};
const scream=()=>{tone(950,.9,'sawtooth',.25,260);tone(1400,.9,'square',.1,500);noise(.9,.45,4000)};
function droneOn(){const a=ac();if(!a||dr)return;const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.value=43;g.gain.value=.03;o.connect(g).connect(a.destination);o.start();dr=o}
function droneOff(){if(dr){try{dr.stop()}catch(e){}dr=null}}
/* ---------- Game ---------- */
let G=null,raf=0,name='';
const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))};
const banner=(t,ms,cb)=>{const b=$('banner');b.textContent=t;b.classList.add('on');setTimeout(()=>{b.classList.remove('on');cb&&cb()},ms)};
function startGame(){
  name=$('name').value.trim();
  if(!name){$('name').focus();$('name').style.borderColor='#f33';return}
  try{localStorage.setItem('carrot_name',name)}catch(e){}
  ac();droneOn();
  G={phase:'closed',score:0,round:0,done:0,K:0,T:0,t0:0,fuse:0,beat:0};
  $('score').textContent=0;$('frame').classList.remove('open');$('carrot').className='cw';
  show('game');nextRound();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
}
function nextRound(flash){
  G.round++;const r=G.round;G.K=3+r;const per=Math.max(.8,2.6-.15*(r-1));G.T=Math.round(G.K*per*10)/10;G.done=0;
  G.phase='closed';G.t0=performance.now();$('rnd').textContent='ノルマ '+r;updHud(G.T);
  if(flash){const q=$('quota');q.classList.remove('flash');void q.offsetWidth;q.classList.add('flash')}
}
function updHud(left){
  $('quota').textContent=G.done+' / '+G.K+'回　'+Math.max(0,left).toFixed(1)+'秒';
  const q=$('qbar');q.firstElementChild.style.width=Math.max(0,left/G.T*100)+'%';q.classList.toggle('low',left<G.T*.3);
}
function tick(now){
  if(!G||G.phase==='over'){return}
  if(G.phase!=='intro'){const left=G.T-(now-G.t0)/1000;updHud(left);if(left<=0){gameOver('time');return}}
  raf=requestAnimationFrame(tick);
}
function toggle(){
  if(!G)return;ac();
  if(G.phase==='closed'){
    $('man').className='cw';
    G.phase='open';G.score++;$('score').textContent=G.score;$('frame').classList.add('open');creak();$('door-btn').textContent='閉める';
    const r=Math.random(),pc=Math.min(.55,.2+.02*G.score),pm=G.score>=3?Math.min(.3,.1+.01*G.score):0;
    if(r<pc)spawnCarrot();else if(r<pc+pm)spawnMan();
  }else if(G.phase==='open'||G.phase==='man'){
    $('man').className='cw';$('tip').textContent='';
    $('frame').classList.remove('open');shut();$('door-btn').textContent='開ける';G.done++;
    if(G.done>=G.K)nextRound(true);else G.phase='closed';
  }else if(G.phase==='carrot'){gameOver('close')}
}
function spawnMan(){G.phase='man';$('man').className='cw show';$('tip').textContent='触るな。閉めろ。';tone(70,.6,'sawtooth',.06,55)}
function spawnCarrot(){
  G.phase='carrot';const c=$('carrot');c.className='cw show';
  $('stage').classList.add('danger');$('tip').textContent='タップ！！';
  const f=$('fuse');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  beat();G.beat=setInterval(beat,420);
  G.fuse=setTimeout(()=>gameOver('bite'),1000);
}
function calm(){clearTimeout(G.fuse);clearInterval(G.beat);$('stage').classList.remove('danger');$('fuse').classList.remove('go');$('tip').textContent=''}
function kill(e){
  if(G&&G.phase==='man'){e&&e.preventDefault();gameOver('man');return}
  if(!G||G.phase!=='carrot')return;e&&e.preventDefault();calm();G.phase='open';hit();
  const s=$('slash');s.classList.remove('go');void s.offsetWidth;s.classList.add('go');
  $('carrot').className='cw show dead';if(navigator.vibrate)navigator.vibrate(30);
  setTimeout(()=>{$('carrot').className='cw'},300);
}
async function gameOver(why){
  if(!G||G.phase==='over')return;
  calm();G.phase='over';cancelAnimationFrame(raf);droneOff();
  const sc=G.score;
  const man=why==='man';$('sc-img').src=(man?$('man'):$('carrot')).firstElementChild.src;$('scare').firstElementChild.style.aspectRatio=man?'191/440':'';$('scare').classList.toggle('man',man);$('scare').classList.add('on');scream();if(navigator.vibrate)navigator.vibrate([200,60,300]);
  $('why').textContent={bite:'1秒以内にタップできなかった。人参が襲いかかる。',close:'倒さずに扉を閉めてしまった。',man:'触ってはいけない男に触れてしまった。',time:'ノルマに間に合わなかった。扉の向こうから、何かが来る。'}[why];
  $('fscore').textContent=sc;$('nb').textContent='';$('rank-over').innerHTML='';
  setTimeout(async()=>{
    $('scare').classList.remove('on');show('over');$('door-btn').textContent='開ける';
    const r=await saveBest(name,sc);
    if(r.ok&&r.isNew)$('nb').textContent='自己ベスト更新！';
    else if(r.ok&&r.best)$('nb').textContent='自己ベスト：'+r.best+'回';
    loadRank($('rank-over'),name);
  },1400);
}
/* ---------- events ---------- */
$('start').onclick=startGame;$('retry').onclick=startGame;
$('tohome').onclick=()=>show('home');
$('rankbtn').onclick=()=>{const n=$('name').value.trim()||name;show('rank');loadRank($('rank-view'),n)};
$('rankback').onclick=()=>show('home');
$('door-btn').addEventListener('pointerdown',e=>{e.preventDefault();toggle()});
$('doorway').addEventListener('pointerdown',kill);
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')startGame()});
addEventListener('keydown',e=>{if(e.code==='Space'&&$('game').classList.contains('on')){e.preventDefault();G&&G.phase==='carrot'?kill():toggle()}});
try{name=localStorage.getItem('carrot_name')||'';$('name').value=name}catch(e){}
</script></body></html>
