<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>にんじんドア</title>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
<style>
:root{--bg:#14161c;--wall:#232733;--paper:#f6e7b8;--ink:#231616;--wood:#6b3f22;--wood2:#8a5530;--accent:#ff8a3d;--bad:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#14161c}}
:root[data-theme="dark"]{--bg:#14161c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--paper);font-family:'Yomogi','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;overflow:hidden;touch-action:manipulation}
.screen{position:absolute;inset:0;padding:env(safe-area-inset-top,0) 20px env(safe-area-inset-bottom,0);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.screen.on{display:flex}
h1{font-size:clamp(40px,12vw,64px);margin:0;line-height:1.1;font-weight:400;transform:rotate(-3deg)}
.sub{opacity:.75;margin:0}
.btn{font:inherit;font-size:24px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px 22px 16px 24px;padding:12px 36px;box-shadow:4px 5px 0 var(--accent);cursor:pointer}
.btn:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--accent)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.rank{background:rgba(246,231,184,.08);border:2px dashed rgba(246,231,184,.4);border-radius:12px;padding:10px 18px;min-width:230px;text-align:left}
.rank b{display:block;text-align:center;font-weight:400;margin-bottom:4px}
.rank li{display:flex;justify-content:space-between;gap:16px;margin:2px 0}
.rank ol{margin:0;padding-left:22px}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;text-align:center;font-size:26px;z-index:5}
#hud span{color:var(--accent);font-size:34px}
#room{flex:1;width:100%;display:flex;align-items:center;justify-content:center;perspective:900px}
.frame{position:relative;width:min(62vw,300px);aspect-ratio:3/5;max-height:62vh;background:var(--paper);border:12px solid #3a2414;border-radius:6px 6px 0 0;box-shadow:0 0 60px rgba(255,200,100,.25),inset 0 0 30px rgba(0,0,0,.4);overflow:visible}
.inside{position:absolute;inset:0;background:radial-gradient(circle at 50% 70%,#ffe9a8,#c98d45 80%);display:grid;place-items:end center;overflow:hidden}
.door{position:absolute;inset:0;background:linear-gradient(90deg,var(--wood),var(--wood2) 50%,var(--wood));border:3px solid #2a170b;transform-origin:left center;transition:transform .5s cubic-bezier(.5,0,.2,1);transform:rotateY(0)}
.door.open{transform:rotateY(-105deg)}
.door::before,.door::after{content:"";position:absolute;left:14%;right:14%;border:3px solid rgba(0,0,0,.35);border-radius:4px}
.door::before{top:7%;height:38%}.door::after{bottom:7%;height:38%}
.knob{position:absolute;right:10%;top:50%;width:16px;height:16px;border-radius:50%;background:#f1c24b;border:2px solid var(--ink);z-index:2}
#mon,#fri{grid-area:1/1}
#fri{width:80%;max-height:70%;object-fit:contain;transform:translateY(110%);transition:transform .25s ease-out}
#fri.show{transform:translateY(0)}
#mon{width:88%;max-height:96%;object-fit:contain;transform:translateY(110%) scale(.9);transition:transform .25s ease-out;touch-action:manipulation}
#mon.show{transform:translateY(0) scale(1)}
#mon.hit{animation:pop .3s forwards}
@keyframes pop{0%{transform:scale(1.15) rotate(-6deg)}100%{transform:scale(.1) rotate(40deg);opacity:0}}
#hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;color:var(--bad);text-shadow:0 0 6px #000;pointer-events:none;opacity:0}
#hint.on{opacity:1;animation:bl .5s infinite alternate}
@keyframes bl{to{transform:translate(-50%,-50%) scale(1.15)}}
#bar{width:100%;display:flex;justify-content:center;padding:14px 0 26px}
#act{width:84px;height:84px;border-radius:50%;font-size:17px;padding:0;box-shadow:4px 5px 0 var(--accent)}
.rank ol.full{font-size:20px;min-width:240px}
.rank ol.full li{padding:2px 0;border-bottom:1px dotted rgba(246,231,184,.25)}
.over h2{font-size:46px;margin:0;color:var(--bad);font-weight:400}
.over input{font:inherit;font-size:22px;text-align:center;border:3px solid var(--ink);border-radius:12px;padding:8px;width:220px;background:var(--paper);color:var(--ink)}
#tbar{position:absolute;left:0;right:0;bottom:-26px;height:10px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden;opacity:0}
#tbar.on{opacity:1}
#tbar i{display:block;height:100%;width:100%;background:var(--bad);transform-origin:left}
#tbar.on i{animation:tb 1s linear forwards}
@keyframes tb{to{transform:scaleX(0)}}
#mon.atk{animation:atk .35s ease-in forwards;z-index:3}
@keyframes atk{0%{transform:scale(1)}100%{transform:scale(3.2) translateY(-10%)}}
#flash{position:fixed;inset:0;background:var(--bad);opacity:0;pointer-events:none;z-index:20}
#flash.on{animation:fl .5s}
@keyframes fl{0%{opacity:.8}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.door,#mon{transition:none}#hint.on{animation:none}}
</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head><body>

<div id="flash"></div>
<section id="home" class="screen on">
  <h1>にんじん<br>ドア</h1>
  <p class="sub">ドアをあけて、しめる。<br>ばけものはタップでたいじ!<br>わらってるこは タップしちゃダメ!</p>
  <button class="btn" id="start">スタート</button>
  <button class="btn" id="rankBtn" style="font-size:20px">ランキング</button>
</section>

<section id="ranking" class="screen">
  <h1 style="font-size:40px">ランキング</h1>
  <div class="rank"><ol class="full" id="rankFull"></ol></div>
  <button class="btn" id="back" style="font-size:20px">もどる</button>
</section>

      <div class="door" id="door"><div class="knob"></div></div>
      <div id="hint">タップ!</div><div id="tbar"><i></i></div>
    </div>
  </div>
  <div id="bar"><button class="btn" id="act">あける</button></div>
</section>

<section id="over" class="screen over">
  <h2>ゲームオーバー</h2>
  <p class="sub" id="why"></p>
  <p style="font-size:30px;margin:0">あけた数 <span id="final" style="color:var(--accent)">0</span></p>
  <input id="name" maxlength="8" placeholder="なまえ" aria-label="なまえ">
  <button class="btn" id="save">ランキングにのせる</button>
  <button class="btn" id="retry" style="font-size:20px">ホームへ</button>
</section>

<script>
const firebaseConfig={
  apiKey:"AIzaSyAitmCVB6ILKx2CgxmC7CIKlf16OSch_N4",
  authDomain:"hirai1.firebaseapp.com",
  databaseURL:"https://hirai1-default-rtdb.firebaseio.com",
  projectId:"hirai1",
  storageBucket:"hirai1.firebasestorage.app",
  messagingSenderId:"227398539379",
  appId:"1:227398539379:web:44ead14c65d055c5e9b206",
  measurementId:"G-K8CK47S5KB"
};
let db=null;
try{if(window.firebase){firebase.initializeApp(firebaseConfig);db=firebase.database()}}catch(e){console.error(e)}

const $=id=>document.getElementById(id);
const show=id=>document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
const ATTACK_MS=1000;
let friend=false,count=0,isOpen=false,busy=false,monster=false,atkTimer=null,dead=false;

/* ---- ランキング (Firebase Realtime Database /ranking) ---- */
const Ranking={
  async load(){
    if(db){
      try{
        const s=await db.ref('ranking').orderByChild('score').limitToLast(10).once('value');
        const a=[];s.forEach(c=>{a.push(c.val())});
        return a.sort((x,y)=>y.score-x.score);
      }catch(e){console.error(e)}
    }
    try{return JSON.parse(localStorage.getItem('carrotRank')||'[]')}catch(e){return []}
  },
  async submit(name,score){
    if(db){
      try{await db.ref('ranking').push({name,score,t:firebase.database.ServerValue.TIMESTAMP});return}
      catch(e){console.error(e)}
    }
    const l=await this.load();l.push({name,score});l.sort((a,b)=>b.score-a.score);
    try{localStorage.setItem('carrotRank',JSON.stringify(l.slice(0,10)))}catch(e){}
  }
};
const esc=s=>String(s).replace(/[<>&"]/g,'');
async function renderRank(){
  $('rankFull').innerHTML='<li>よみこみ中…</li>';
  const l=(await Ranking.load()).slice(0,10);
  $('rankFull').innerHTML=l.length?l.map(r=>`<li><span>${esc(r.name)}</span><span>${Number(r.score)}</span></li>`).join(''):'<li>まだありません</li>';
}

function startGame(){
  clearTimeout(atkTimer);
  count=0;isOpen=false;busy=false;monster=false;friend=false;dead=false;
  $('fri').className='';$('cnt').textContent=0;$('door').classList.remove('open');
  $('mon').className='';$('hint').classList.remove('on');$('tbar').classList.remove('on');
  $('act').textContent='あける';show('game');
}
function openDoor(){
  busy=true;isOpen=true;$('door').classList.add('open');$('act').textContent='しめる';
  const p=Math.min(.3+count*.03,.7),r=Math.random();monster=r<p;friend=!monster&&r<p+.2;
  if(friend){$('fri').className='show'}
  if(monster){ // あけた瞬間にもういる! 1秒いないにタップ
    $('mon').className='show';$('hint').classList.add('on');
    const b=$('tbar');b.classList.remove('on');void b.offsetWidth;b.classList.add('on');
    if(navigator.vibrate)navigator.vibrate(30);
    atkTimer=setTimeout(attack,ATTACK_MS);
  }
  setTimeout(()=>{busy=false},500);
}
function attack(){
  if(!monster||dead)return;
  dead=true;$('hint').classList.remove('on');
  $('mon').className='show atk';$('flash').classList.add('on');
  if(navigator.vibrate)navigator.vibrate([80,40,120]);
  setTimeout(()=>gameOver('1びょうで たおせなかった…'),450);
}
function closeDoor(){
  if(monster){return gameOver('ばけものを たおさず しめちゃった…')}
  busy=true;isOpen=false;count++;$('cnt').textContent=count;
  $('door').classList.remove('open');$('act').textContent='あける';
  setTimeout(()=>{busy=false;if(!dead){friend=false;$('fri').className='';$('mon').className=''}},500);
}
function gameOver(why){
  clearTimeout(atkTimer);dead=true;$('tbar').classList.remove('on');$('flash').classList.remove('on');
  $('why').textContent=why||'';$('final').textContent=count;$('name').value='';$('save').disabled=false;
  show('over');
}
$('act').onclick=()=>{if(dead||busy&&!isOpen)return;isOpen?closeDoor():openDoor()};
$('mon').addEventListener('pointerdown',e=>{
  if(!monster||!isOpen||dead)return;e.preventDefault();
  clearTimeout(atkTimer);monster=false;
  $('hint').classList.remove('on');$('tbar').classList.remove('on');$('mon').className='hit';
  if(navigator.vibrate)navigator.vibrate(60);
});
$('fri').addEventListener('pointerdown',e=>{
  if(!friend||!isOpen||dead)return;e.preventDefault();
  dead=true;$('flash').classList.add('on');if(navigator.vibrate)navigator.vibrate([80,40,120]);
  setTimeout(()=>gameOver('わらってるこを タップしちゃった…'),350);
});
$('rankBtn').onclick=()=>{show('ranking');renderRank()};
$('back').onclick=()=>show('home');
$('start').onclick=startGame;
$('save').onclick=async()=>{
  $('save').disabled=true;
  await Ranking.submit(($('name').value.trim()||'ななし').slice(0,8),count);
  show('ranking');await renderRank();
};
$('retry').onclick=()=>show('home');
</script></body></html>
